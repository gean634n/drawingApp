<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- <link rel="stylesheet" href="./styles/layout.css" /> -->
        <link rel="stylesheet" href="./styles/style.css" />

        <!-- O atributo 'defer' faz com que o código espere o carregamento da pagina antes de executar-->
        <script src="src/main.js" defer></script>
        <title>Drawing App</title>
    </head>
    <body>
        <canvas id="myCanvas"></canvas>
        <div class="nav">
            <div class="color" data-color="#000"></div>
            <div class="color" data-color="red"></div>
            <div class="color" data-color="orange"></div>
            <div class="color" data-color="blue"></div>
            <div class="color" data-color="purple"></div>
            <div class="color" data-color="yellowgreen"></div>
            <div class="color" data-color="yellow"></div>
            <div class="color" data-color="#fff"></div>

            <!-- <div class="line-toggle-button" data-style="solid" id="solid-btn">
                <span class="line solid-line active"></span>
                <span class="line dashed-line"></span>
                <span class="line dotted-line"></span>
            </div>      -->

            <button class="clear">Clear</button>
            <button class="save">Save</button>

            <input type="color" value="#FFFFFF" id="favcolor" />
            <input
                type="range"
                name="ageInputName"
                id="ageInputId"
                value="5"
                min="1"
                max="10"
                oninput="ageOutputId.value = ageInputId.value"
            />
            <output id="ageOutputId">5</output>

            <div class="emoji">🎨</div>
        </div>
    </body>
</html>
